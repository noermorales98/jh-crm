# QA / sandbox CI — lint, typecheck, build WITHOUT prisma migrate.
# JH-001 / TEST-007: nunca corre migrate-on-deploy (build:qa = next build directo).
name: QA

on:
  pull_request:
  push:
    branches: [main, "cursor/**"]

permissions:
  contents: read

concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: lint + typecheck + build:qa
    runs-on: ubuntu-latest
    env:
      QA_SANDBOX: "1"
      CI: "true"
      # Placeholders so Next can compile; no real DB / secrets.
      DATABASE_URL: "mysql://qa:qa@127.0.0.1:3306/jh_qa_unused"
      AUTH_SECRET: "qa-ci-auth-secret-not-for-production-use-32b"
      AUTH_URL: "http://localhost:3000"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      # Block outbound / payments in CI
      FEATURE_CLIENT_PORTAL: "false"
      FEATURE_PUBLIC_INTAKE: "false"
      FEATURE_CONSULTATION_PAYMENTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Prisma generate
        run: npx prisma generate
      - name: Lint
        run: npm run lint
      # typecheck runs `next typegen` first so LayoutProps/route types exist in CI
      - name: Typecheck
        run: npm run typecheck
      - name: Migrate skip smoke (TEST-007)
        run: npm run smoke:qa-baseline
      - name: Smoke org allowlist (e2e/letters gate)
        run: npm run smoke:smoke-safe-org
      - name: Agency Resumen KPIs smoke
        run: npm run smoke:agency-resumen-kpis
      - name: Agency Mi Equipo smoke
        run: npm run smoke:agency-mi-equipo
      - name: Agency Mi Marca smoke
        run: npm run smoke:agency-mi-marca
      - name: Agency Reportes smoke
        run: npm run smoke:agency-reportes
      - name: Ops readiness + AU-006 bureau gate
        run: npm run smoke:ops-readiness && npm run smoke:au-006-bureau-gate
      - name: Score Plan + Fondeo montos smoke
        run: npm run smoke:score-plan && npm run smoke:credit-budget && npm run smoke:credit-anomalies && npm run smoke:credit-assertions && npm run smoke:credit-rounds && npm run smoke:credit-changes && npm run smoke:credit-actions && npm run smoke:credit-programs && npm run smoke:credit-capacity && npm run smoke:credit-metrics && npm run smoke:credit-report-selection && npm run smoke:credit-portal && npm run smoke:credit-operations && npm run smoke:credit-corpus && npm run smoke:credit-telemetry && npm run smoke:credit-journey && npm run smoke:funding-estimate && npm run smoke:funding-prep && npm run smoke:credit-contracts && npm run smoke:credit-scores && npm run smoke:credit-temporal && npm run smoke:credit-revolving && npm run smoke:credit-ownership && npm run smoke:credit-normalize && npm run smoke:credit-access && npm run smoke:credit-identity && npm run smoke:credit-backfill
      - name: Credit PDF chunk/merge + scores smoke
        run: npm run smoke:credit-pdf-chunk-merge && npm run smoke:credit-review
      - name: Credit PDF pending-confirm UI smoke
        run: npm run smoke:credit-pdf-pending-confirm
      - name: Conector MCP de Claude (sin base de datos)
        run: npm run smoke:auth-paths && npm run smoke:login-redirect && npm run smoke:mcp-oauth-core && npm run smoke:mcp-tool-registry
      - name: Build QA (no migrate)
        run: npm run build:qa

  # Smokes que necesitan una base real: MySQL desechable del propio runner.
  # Job aparte para no tocar la regla TEST-007 del job qa (build sin migrate).
  db-smokes:
    name: db smokes (MySQL desechable)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: qa-ci-root-not-a-secret
          MYSQL_DATABASE: jh_gates
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pqa-ci-root-not-a-secret"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      QA_SANDBOX: "1"
      CI: "true"
      DATABASE_URL: "mysql://root:qa-ci-root-not-a-secret@127.0.0.1:3306/jh_gates"
      # prisma.config.ts da prioridad a .env.local; esto fija la base de las migraciones.
      MIGRATE_DATABASE_URL: "mysql://root:qa-ci-root-not-a-secret@127.0.0.1:3306/jh_gates"
      AUTH_SECRET: "qa-ci-auth-secret-not-for-production-use-32b"
      AUTH_URL: "http://localhost:3000"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      FEATURE_CLIENT_PORTAL: "false"
      FEATURE_PUBLIC_INTAKE: "false"
      FEATURE_CONSULTATION_PAYMENTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Prisma generate
        run: npx prisma generate
      - name: Migrate throwaway DB
        run: npx prisma migrate deploy
      - name: Contract gates smoke (rondas y cobros)
        run: npm run smoke:contract-gates-db
      - name: Conector MCP de Claude (OAuth, endpoint, lectura y escritura)
        run: npm run smoke:mcp-db
